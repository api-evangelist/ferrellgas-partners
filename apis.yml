aid: ferrellgas-partners
name: Ferrellgas Partners
description: >-
  Ferrellgas Partners, L.P. (FGPR) is one of the largest propane distributors in the United
  States, selling and delivering propane to residential, commercial, industrial, agricultural,
  wholesale and portable tank exchange customers from a nationwide network of district
  locations, and operating the Blue Rhino propane tank exchange brand. Its digital surface is
  customer-facing rather than developer-facing: MyFerrellgas (myferrellgas.com) is an Angular
  single-page account portal backed by a private backend-for-frontend at bff.myferrellgas.com
  with Amazon Cognito sign-in, and api.ferrellgas.com resolves in DNS but answers every
  anonymous request with HTTP 503. As of this enrichment pass Ferrellgas publishes no developer
  program, no API documentation, no SDKs and no machine-readable API contract.
